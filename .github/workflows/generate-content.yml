# 아카이브 기반 콘텐츠 자동 생성 워크플로우
# - 매일 KST 09:00 (UTC 00:00) 실행
# - maeil-mail-contents GitHub 아카이브의 미수입(pending) 콘텐츠 최대 3개
#   -> Claude로 포스트 생성 -> main 직접 푸시
# - 마지막 스텝에서 워크플로우 self-enable 호출로 GitHub의
#   "60일 무활동 시 스케줄 비활성화"를 방지한다.
#
# 필요한 GitHub Secrets:
#   ANTHROPIC_API_KEY   - Claude API 키 (포스트 생성)
#   VOYAGE_API_KEY      - Voyage AI API 키 (임베딩 생성)
#   SUPABASE_URL        - Supabase 프로젝트 URL
#   SUPABASE_ANON_KEY   - Supabase anon 키
#   SLACK_WEBHOOK_URL   - (선택) 실패/소진 알림용 Slack Webhook

name: Generate Content

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = KST 09:00
  workflow_dispatch: # 수동 실행

permissions:
  contents: write
  actions: write # 워크플로우 self-enable (keepalive)

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run generate-post -- --latest --count 3

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/ scripts/data/
          if git diff --cached --quiet; then
            echo "::notice::변경사항 없음 — 새 포스트가 생성되지 않았습니다."
          else
            git commit -m "content: 자동 생성 포스트"
            git push origin main
          fi

      # GitHub은 60일간 저장소 활동이 없으면 스케줄 워크플로우를 비활성화한다.
      # 매 실행마다 self-enable을 호출해 비활성화 타이머를 리셋한다.
      - name: Keepalive (prevent 60-day auto-disable)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/generate-content.yml/enable" \
            && echo "::notice::워크플로우 keepalive 완료" \
            || echo "::warning::keepalive 실패 (다음 실행에서 재시도)"
